<!DOCTYPE html>
    <html>
        <head>
            <title>Moduli-35 js</title>
            <link rel="stylesheet" href="style.css">
        </head>

        <body>
            <div id="slideshow">

                <div class="slide">
                    <img src="img/img1.jpg" alt="image 1 " width="100%">
                </div>

                 <div class="slide">
                    <img src="img/img2.jpg" alt="image 2 " width="100%">
                </div>

                 <div class="slide">
                    <img src="img/img3.jpg" alt="image 3 " width="100%">
                </div>

                
            </div>
    
              <a class="prev"><img src="img/back_btn.png" alt="back_btn" style="width:70px; height:70px;" onclick="plusSlides(-1)"></a>
             <a class="next"><img src="img/next_btn.png" alt="next_btn" style="width:50px; height:50px;" onclick="plusSlides(1)"></a>

        <script src="main.js"></script>

        </body>
    </html>
